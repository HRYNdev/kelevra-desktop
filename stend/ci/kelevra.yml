# ЗАГОТОВКА для .github/workflows/kelevra.yml — положить её туда я не могу:
# у токена Джарвиса нет права «Workflows: Read and write», а этот путь GitHub
# закрывает отдельно от обычной записи в репозиторий.
#
# ЗАЧЕМ. Живущий сейчас .github/workflows/kelevra.yml собирает ЧУЖОЙ продукт:
# он унаследован от форка GUI.for.SingBox и зовёт `pnpm` в frontend/ и `wails build`,
# а в этом репозитории нет ни frontend/, ни wails.json. Поэтому он падает на
# setup-node (23.08 дважды, в том числе на теге v0.6.9), а windows-job у него
# всегда skipped: он `needs: frontend`. Итог: продукт для Windows ни разу не
# собирался и не тестировался на Windows — только на линуксовой машине Джарвиса.
#
# ЧТО ДЕЛАЕТ ЭТА ЗАМЕНА:
#  1. собирает .exe теми же флагами, что живой vypusk.sh, и проверяет, что версия
#     реально вшита в бинарь (тот же страж, что в выпуске);
#  2. впервые гоняет 32 наших теста на НАСТОЯЩЕЙ Windows — сегодня их видит только
#     линукс, где весь windows-путь подменён заглушкой trey_other.go;
#  3. отдельным некритичным шагом ЗАМЕРЯЕТ, живёт ли на раннере оболочка с треем.
#     Это замер, а не проверка: если трея нет, шаг честно скажет об этом и не
#     покрасит сборку. От его ответа зависит, можно ли доказывать здесь клик по
#     пузырю обновления — тот самый тычок, о котором Вова просил 26.08.
#
# УСТАНОВКА: скопировать этот файл в .github/workflows/kelevra.yml и закоммитить.

name: kelevra-desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  sborka:
    name: Сборка .exe (как в vypusk.sh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Собрать
        shell: pwsh
        run: |
          $v = "ci-$($env:GITHUB_SHA.Substring(0,7))"
          $env:CGO_ENABLED = "0"
          go build -ldflags "-H=windowsgui -s -w -X github.com/HRYNdev/kelevra-desktop/internal/podpiska.Versiya=$v" -o Kelevra.exe ./cmd/kelevra
          # тот же страж, что в vypusk.sh: версия обязана лежать в бинаре.
          # Байты читаем сами: -Encoding byte у Select-String есть в PS 5.1 и нет в pwsh 7.
          $txt = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("Kelevra.exe"))
          if ($txt -notmatch [regex]::Escape($v)) {
            Write-Error "в собранном exe нет строки $v: ldflags не сработали"; exit 1
          }
          Get-Item Kelevra.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: kelevra-desktop-windows
          path: Kelevra.exe
          if-no-files-found: error

  testy:
    name: Тесты на настоящей Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: go test ./...
        run: go test ./...

  zamer_treya:
    name: Замер — есть ли на раннере живой трей
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./stend/ci/zamer_treya.ps1

  linux:
    name: Компиляция под Windows с линукса (быстрый страж)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: GOOS=windows GOARCH=amd64 go vet ./...
