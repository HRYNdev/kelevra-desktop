name: core

# Ядро для десктопа: тот же апстрим sing-box плюс наш транспорт xhttp.
# Патч лежит в репозитории приложения (kelevra-box/core-xhttp) — держим в одном месте.
#
# Обе стороны берутся по фиксированной точке: sing-box — по тегу, патч — по
# коммиту kelevra-box. Раньше патч брался с головы kelevra-box, а там он уже
# переписан под sing-box v1.14.1 (sing-quic 0.7.0: другой BBR), и сборка
# v1.14.0-beta.4 падала на congestion_meta2.NewBbrSenderWithProfile, хотя в
# этом репозитории ничего не менялось. Пара по умолчанию — beta.4 и последний
# коммит патча, который ещё под неё (до перехода Box на v1.14.1).
# Сменить ядро — менять тег и коммит патча вместе.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Тег sing-box"
        required: false
        default: "v1.14.0-beta.4"
      patch_ref:
        description: "Коммит kelevra-box с патчем core-xhttp (SHA, совместимый с тегом выше)"
        required: false
        default: "1af139394ca4bd633ff2395cd42899789466fcf7"
      vypustit:
        description: "Выложить релиз core-* (иначе только сборка и проверки)"
        type: boolean
        required: false
        default: false
      probnoe:
        description: "Пробная сборка (prerelease): клиенты её не берут, только стенд с KELEVRA_YADRO_PROBNYE=1"
        type: boolean
        required: false
        default: false

env:
  CORE_REF: ${{ github.event.inputs.core_ref || 'v1.14.0-beta.4' }}
  # Тег сборки ядра: номер прогона и номер повтора — повторный прогон не
  # кладёт второй архив под тот же тег. Клиент сравнивает теги по версии
  # (internal/yadro/versiya_sborki.go): core-v<semver>-<прогон>.<повтор>.
  TEG_YADRA: core-${{ github.event.inputs.core_ref || 'v1.14.0-beta.4' }}-${{ github.run_number }}.${{ github.run_attempt }}
  PATCH_REF: ${{ github.event.inputs.patch_ref || '1af139394ca4bd633ff2395cd42899789466fcf7' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Тег sing-box — только semver (vX.Y.Z или vX.Y.Z-проба): из него
      # собирается тег сборки, который клиенты разбирают и сравнивают.
      - name: Проверить тег sing-box
        run: |
          if ! [[ "$CORE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "ОШИБКА: core_ref «$CORE_REF» не semver (ждём vX.Y.Z или vX.Y.Z-beta.N)"
            exit 1
          fi
          echo "тег сборки: $TEG_YADRA"

      - uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          path: core
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: HRYNdev/kelevra-box
          ref: ${{ env.PATCH_REF }}
          path: app
          sparse-checkout: core-xhttp

      - name: Наложить патч транспорта
        run: |
          echo "sing-box $CORE_REF ($(git -C core rev-parse HEAD)), патч kelevra-box $(git -C app rev-parse HEAD)"
          python3 app/core-xhttp/apply.py core

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
          check-latest: true

      - name: Сборка под Windows
        working-directory: core
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -tags "with_utls,with_quic,with_gvisor,with_clash_api,with_wireguard" \
            -trimpath -ldflags "-s -w" \
            -o ../kelevra-core.exe ./cmd/sing-box
          ls -lh ../kelevra-core.exe

      - name: Проверка что транспорт внутри
        run: |
          if grep -qa 'v2rayxhttp' kelevra-core.exe; then
            echo "транспорт xhttp внутри ядра: есть"
          else
            echo "ОШИБКА: ядро собрано без нашего транспорта"
            exit 1
          fi

      - name: Упаковать как ждёт интерфейс
        run: |
          mkdir -p pack && cp kelevra-core.exe pack/sing-box.exe
          cd pack && zip -q "../sing-box-windows-amd64.zip" sing-box.exe
          ls -lh ../sing-box-windows-amd64.zip

      # Подпись архива (internal/podpis): десктоп ставит ядро только с верной
      # подписью нашего ключа. Подписываем под именем, под которым файл
      # лежит в релизе. Секрет KELEVRA_SIGN_KEY — тот же, что в vypusk.yml.
      # Подписывает код того же коммита, с которого запущена сборка.
      - uses: actions/checkout@v5
        with:
          path: sign-src

      # Тег релиза входит в подпись (второй формат): замена ядра у стоящих
      # установок принимает архив только под тем тегом, под которым он подписан.
      - name: Подписать архив ядра
        env:
          KELEVRA_SIGN_KEY: ${{ secrets.KELEVRA_SIGN_KEY }}
        run: |
          (cd sign-src && go run ./cmd/podpisat ../sing-box-windows-amd64.zip sing-box-windows-amd64.zip "$TEG_YADRA")
          test -s sing-box-windows-amd64.zip.sig

      - uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.vypustit == 'true' }}
        with:
          tag_name: ${{ env.TEG_YADRA }}
          name: Ядро ${{ env.CORE_REF }} (сборка ${{ github.run_number }}.${{ github.run_attempt }})
          body: |
            Ядро своей сети: апстрим sing-box плюс транспорт xhttp, которого нет в официальных сборках.
            Проверка наличия транспорта проходит в сборке автоматически.
          files: |
            sing-box-windows-amd64.zip
            sing-box-windows-amd64.zip.sig
          # Пробная сборка не уходит ни новым установкам, ни на замену у стоящих.
          prerelease: ${{ github.event.inputs.probnoe == 'true' }}
          # Релиз ядра не должен становиться «последним»: latest/download/Kelevra.exe отдал бы 404.
          make_latest: false
