name: core

# Ядро для десктопа: тот же апстрим sing-box плюс наш транспорт xhttp.
# Патч лежит в репозитории приложения (kelevra-box/core-xhttp) — держим в одном месте.
#
# Обе стороны берутся по фиксированной точке: sing-box — по тегу, патч — по
# коммиту kelevra-box. Тег и коммит патча — пара: патч на любом коммите
# kelevra-box написан под тот тег, что стоит там же в release.yml (CORE_REF).
# 18.10.2026 сборка v1.14.0-beta.4 падала на congestion_meta2.NewBbrSenderWithProfile
# не из-за апстрима: патч брался с головы kelevra-box, уже переписанной под
# v1.14.1 (sing-quic 0.7.0, другой BBR).
#
# Пара по умолчанию: v1.14.1 и коммит kelevra-box e213cfcc — патч с правкой 6
# (Reality шлёт X25519MLKEM768, без неё Xray >= 26.9.8 на узлах ядро не пустит).
# Коммит пока живёт в ветке PR #53 kelevra-box; после вливания поставить сюда
# коммит из dev, в котором эта правка есть. Одно ядро на оба клиента: сменить
# ядро — менять тег и коммит патча вместе, здесь и в release.yml Box.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Тег sing-box"
        required: false
        default: "v1.14.1"
      patch_ref:
        description: "Коммит kelevra-box с патчем core-xhttp (SHA, совместимый с тегом выше)"
        required: false
        default: "e213cfccd57f7a04cd9074cac9e2113835a5524d"
      vypustit:
        description: "Выложить релиз core-* (иначе только сборка и проверки)"
        type: boolean
        required: false
        default: false

env:
  CORE_REF: ${{ github.event.inputs.core_ref || 'v1.14.1' }}
  PATCH_REF: ${{ github.event.inputs.patch_ref || 'e213cfccd57f7a04cd9074cac9e2113835a5524d' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          path: core
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: HRYNdev/kelevra-box
          ref: ${{ env.PATCH_REF }}
          path: app
          sparse-checkout: core-xhttp

      - name: Наложить патч транспорта
        run: |
          echo "sing-box $CORE_REF ($(git -C core rev-parse HEAD)), патч kelevra-box $(git -C app rev-parse HEAD)"
          python3 app/core-xhttp/apply.py core

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
          check-latest: true

      - name: Сборка под Windows
        working-directory: core
        run: |
          # Версия как у Box (тег без ведущей v), иначе `sing-box version` пишет «unknown».
          VERSION=$(git describe --tags | sed 's/^v//')
          echo "версия ядра: $VERSION"
          GOOS=windows GOARCH=amd64 go build \
            -tags "with_utls,with_quic,with_gvisor,with_clash_api,with_wireguard" \
            -trimpath -ldflags "-X github.com/sagernet/sing-box/constant.Version=$VERSION -s -w" \
            -o ../kelevra-core.exe ./cmd/sing-box
          ls -lh ../kelevra-core.exe

      - name: Проверка что транспорт внутри
        run: |
          if grep -qa 'v2rayxhttp' kelevra-core.exe; then
            echo "транспорт xhttp внутри ядра: есть"
          else
            echo "ОШИБКА: ядро собрано без нашего транспорта"
            exit 1
          fi

      # Правка 6 патча (Reality X25519MLKEM768): без неё Xray >= 26.9.8 на узлах
      # это ядро не пустит. Такое ядро не выпускаем: сборка падает. Старый коммит
      # патча без правки 6 этой проверки не пройдёт — так и задумано.
      - name: Есть ли в ядре ML-KEM для Reality
        run: |
          if grep -q 'mlkemCurve' core/common/tls/reality_client.go; then
            echo "Reality X25519MLKEM768: есть, ядро пройдёт Xray >= 26.9.8"
          else
            echo "::error::Reality X25519MLKEM768: НЕТ (патч $PATCH_REF без правки 6), с Xray >= 26.9.8 на узлах это ядро не подключится"
            exit 1
          fi

      - name: Упаковать как ждёт интерфейс
        run: |
          mkdir -p pack && cp kelevra-core.exe pack/sing-box.exe
          cd pack && zip -q "../sing-box-windows-amd64.zip" sing-box.exe
          ls -lh ../sing-box-windows-amd64.zip

      # Подпись архива (internal/podpis): десктоп ставит ядро только с верной
      # подписью нашего ключа. Подписываем под именем, под которым файл
      # лежит в релизе. Секрет KELEVRA_SIGN_KEY — тот же, что в vypusk.yml.
      # Подписывает код того же коммита, с которого запущена сборка.
      - uses: actions/checkout@v5
        with:
          path: sign-src

      - name: Подписать архив ядра
        env:
          KELEVRA_SIGN_KEY: ${{ secrets.KELEVRA_SIGN_KEY }}
        run: |
          (cd sign-src && go run ./cmd/podpisat ../sing-box-windows-amd64.zip sing-box-windows-amd64.zip)
          test -s sing-box-windows-amd64.zip.sig

      - uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.vypustit == 'true' }}
        with:
          tag_name: core-${{ env.CORE_REF }}-${{ github.run_number }}
          name: Ядро ${{ env.CORE_REF }} (сборка ${{ github.run_number }})
          body: |
            Ядро своей сети: апстрим sing-box плюс транспорт xhttp, которого нет в официальных сборках.
            Проверка наличия транспорта проходит в сборке автоматически.
          files: |
            sing-box-windows-amd64.zip
            sing-box-windows-amd64.zip.sig
          prerelease: false
          # Релиз ядра не должен становиться «последним»: latest/download/Kelevra.exe отдал бы 404.
          make_latest: false
