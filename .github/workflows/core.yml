name: core

# Ядро для десктопа: тот же апстрим sing-box плюс наш транспорт xhttp.
# Патч лежит в репозитории приложения (kelevra-box/core-xhttp) — держим в одном месте.
#
# Обе стороны берутся по фиксированной точке: sing-box — по тегу, патч — по
# коммиту kelevra-box. Тег и коммит патча — пара: патч на любом коммите
# kelevra-box написан под тот тег, что стоит там же в release.yml (CORE_REF).
# 18.10.2026 сборка v1.14.0-beta.4 падала на congestion_meta2.NewBbrSenderWithProfile
# не из-за апстрима: патч брался с головы kelevra-box, уже переписанной под
# v1.14.1 (sing-quic 0.7.0, другой BBR).
#
# Пара по умолчанию: v1.14.1 и коммит kelevra-box 922c9299 (ветка
# feat/mlkem-po-priznaku) — патч с правками 6 и 7, привязанными к признаку профиля:
# X25519MLKEM768 в Reality и ChaCha20 первым у chrome — только у выхода, где сервер
# поставил tls.reality.support_x25519mlkem768: true. Без признака ClientHello как у
# ядра без правок. Так новое рукопожатие включается сервером по людям и устройствам
# (кольцом), а не всем, кто поставил ядро. Ядро до этого патча (в том числе сборки
# с правками 6 и 7 без признака) на поле признака не стартует — сервер шлёт его
# только ядрам с этим патчем (тег ядра в User-Agent). После вливания поставить сюда
# коммит из dev, в котором правка есть. Одно ядро на оба клиента: сменить
# ядро — менять тег и коммит патча вместе, здесь и в release.yml Box.
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Тег sing-box"
        required: false
        default: "v1.14.1"
      patch_ref:
        description: "Коммит kelevra-box с патчем core-xhttp (SHA, совместимый с тегом выше)"
        required: false
        default: "922c9299ca3409efdea1ab2c2bc358e94784e687"
      vypustit:
        description: "Выложить релиз core-* (иначе только сборка и проверки)"
        type: boolean
        required: false
        default: false
      probnoe:
        description: "Пробная сборка (prerelease): клиенты её не берут, только стенд с KELEVRA_YADRO_PROBNYE=1"
        type: boolean
        required: false
        default: false

env:
  CORE_REF: ${{ github.event.inputs.core_ref || 'v1.14.1' }}
  # Тег сборки ядра: номер прогона и номер повтора — повторный прогон не
  # кладёт второй архив под тот же тег. Клиент сравнивает теги по версии
  # (internal/yadro/versiya_sborki.go): core-v<semver>-<прогон>.<повтор>.
  TEG_YADRA: core-${{ github.event.inputs.core_ref || 'v1.14.1' }}-${{ github.run_number }}.${{ github.run_attempt }}
  PATCH_REF: ${{ github.event.inputs.patch_ref || '922c9299ca3409efdea1ab2c2bc358e94784e687' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Тег sing-box — только semver (vX.Y.Z или vX.Y.Z-проба): из него
      # собирается тег сборки, который клиенты разбирают и сравнивают.
      - name: Проверить тег sing-box
        run: |
          if ! [[ "$CORE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "ОШИБКА: core_ref «$CORE_REF» не semver (ждём vX.Y.Z или vX.Y.Z-beta.N)"
            exit 1
          fi
          echo "тег сборки: $TEG_YADRA"

      - uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.CORE_REF }}
          path: core
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: HRYNdev/kelevra-box
          ref: ${{ env.PATCH_REF }}
          path: app
          sparse-checkout: core-xhttp

      - name: Наложить патч транспорта
        run: |
          echo "sing-box $CORE_REF ($(git -C core rev-parse HEAD)), патч kelevra-box $(git -C app rev-parse HEAD)"
          python3 app/core-xhttp/apply.py core

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
          check-latest: true

      - name: Сборка под Windows
        working-directory: core
        run: |
          # Версия как у Box (тег без ведущей v), иначе `sing-box version` пишет «unknown».
          VERSION=$(git describe --tags | sed 's/^v//')
          echo "версия ядра: $VERSION"
          GOOS=windows GOARCH=amd64 go build \
            -tags "with_utls,with_quic,with_gvisor,with_clash_api,with_wireguard" \
            -trimpath -ldflags "-X github.com/sagernet/sing-box/constant.Version=$VERSION -s -w" \
            -o ../kelevra-core.exe ./cmd/sing-box
          ls -lh ../kelevra-core.exe

      - name: Проверка что транспорт внутри
        run: |
          if grep -qa 'v2rayxhttp' kelevra-core.exe; then
            echo "транспорт xhttp внутри ядра: есть"
          else
            echo "ОШИБКА: ядро собрано без нашего транспорта"
            exit 1
          fi

      # Правка 6 патча (Reality X25519MLKEM768): без неё Xray >= 26.9.8 на узлах
      # это ядро не пустит. Такое ядро не выпускаем: сборка падает. Старый коммит
      # патча без правки 6 этой проверки не пройдёт — так и задумано.
      - name: Есть ли в ядре ML-KEM для Reality
        run: |
          if grep -q 'mlkemCurve' core/common/tls/reality_client.go; then
            echo "Reality X25519MLKEM768: есть, ядро пройдёт Xray >= 26.9.8"
          else
            echo "::error::Reality X25519MLKEM768: НЕТ (патч $PATCH_REF без правки 6), с Xray >= 26.9.8 на узлах это ядро не подключится"
            exit 1
          fi

      # Правка 7 патча: с ML-KEM у chrome ChaCha20 первым. Ядро с ML-KEM, но без
      # неё, на части линий режется окнами (вид chrome + ML-KEM + AES первым) —
      # такое тоже не выпускаем.
      - name: Есть ли в ядре ChaCha20 первым при ML-KEM
        run: |
          if grep -q 'kelevraRealityChaCha' core/common/tls/reality_client.go && test -f core/common/tls/kelevra_reality_chacha.go; then
            echo "Reality ChaCha20 первым при X25519MLKEM768: есть"
          else
            echo "::error::Reality ChaCha20 первым: НЕТ (патч $PATCH_REF без правки 7), ML-KEM с AES первым на части линий режется"
            exit 1
          fi

      # Привязка правок 6 и 7 к признаку профиля. Ядро, которое шлёт ML-KEM без
      # признака, включило бы новое рукопожатие всем разом — такое не выпускаем.
      - name: ML-KEM только по признаку профиля
        run: |
          if grep -q 'SupportX25519MLKEM768' core/option/tls.go && grep -q 'if e.kelevraMLKEM {' core/common/tls/reality_client.go; then
            echo "Reality X25519MLKEM768 и ChaCha первым: только по support_x25519mlkem768"
          else
            echo "::error::патч $PATCH_REF шлёт ML-KEM без признака профиля (нет support_x25519mlkem768) — новое рукопожатие ушло бы всем"
            exit 1
          fi

      # Проверки ClientHello из патча (core-xhttp/tests): без признака — как апстрим
      # поле за полем, с признаком — ML-KEM и ChaCha первым; признак читается из
      # профиля разбором libbox. Сеть не нужна (net.Pipe).
      - name: Проверки ClientHello
        working-directory: core
        run: |
          cp ../app/core-xhttp/tests/reality_*_test.go common/tls/
          go test -tags with_utls -count=1 ./common/tls/ -run 'TestRealityPriznak|TestRealityChaCha|TestRealityMLKEM|TestKelevraChaCha' -v | grep -E '^(=== RUN|--- |PASS|FAIL|ok)'
          test "${PIPESTATUS[0]}" -eq 0

      - name: Упаковать как ждёт интерфейс
        run: |
          mkdir -p pack && cp kelevra-core.exe pack/sing-box.exe
          cd pack && zip -q "../sing-box-windows-amd64.zip" sing-box.exe
          ls -lh ../sing-box-windows-amd64.zip

      # Подпись архива (internal/podpis): десктоп ставит ядро только с верной
      # подписью нашего ключа. Подписываем под именем, под которым файл
      # лежит в релизе. Секрет KELEVRA_SIGN_KEY — тот же, что в vypusk.yml.
      # Подписывает код того же коммита, с которого запущена сборка.
      - uses: actions/checkout@v5
        with:
          path: sign-src

      # Тег релиза входит в подпись (второй формат): замена ядра у стоящих
      # установок принимает архив только под тем тегом, под которым он подписан.
      - name: Подписать архив ядра
        env:
          KELEVRA_SIGN_KEY: ${{ secrets.KELEVRA_SIGN_KEY }}
        run: |
          (cd sign-src && go run ./cmd/podpisat ../sing-box-windows-amd64.zip sing-box-windows-amd64.zip "$TEG_YADRA")
          test -s sing-box-windows-amd64.zip.sig

      - uses: softprops/action-gh-release@v3
        if: ${{ github.event.inputs.vypustit == 'true' }}
        with:
          tag_name: ${{ env.TEG_YADRA }}
          name: Ядро ${{ env.CORE_REF }} (сборка ${{ github.run_number }}.${{ github.run_attempt }})
          body: |
            Ядро своей сети: апстрим sing-box плюс транспорт xhttp, которого нет в официальных сборках.
            Проверка наличия транспорта проходит в сборке автоматически.
          files: |
            sing-box-windows-amd64.zip
            sing-box-windows-amd64.zip.sig
          # Пробная сборка не уходит ни новым установкам, ни на замену у стоящих.
          prerelease: ${{ github.event.inputs.probnoe == 'true' }}
          # Релиз ядра не должен становиться «последним»: latest/download/Kelevra.exe отдал бы 404.
          make_latest: false
