name: kelevra-vypusk

# Выпуск версии приложения: тег app-vX.Y.Z -> проверки -> сборка под Windows ->
# релиз с Kelevra.exe.
#
# Зачем в CI, а не только vypusk.sh локально. Kelevra обновляется у человека
# САМА, из последнего релиза этого репозитория (internal/obnovlenie). Значит
# «сделать релиз» — это правка прямо на его машине, и она не должна зависеть от
# того, жив ли сейчас чей-то ноутбук с wine и go. Тег ставится из git, дальше
# всё делает GitHub, и каждый шаг проверяем.
#
# vypusk.sh остаётся: он умеет то, чего тут нет (приёмка стендом под wine).
# Этот воркфлоу — путь «через GitHub», когда стенд недоступен.

on:
  push:
    tags: ["app-v*"]

jobs:
  # Гейт на НАСТОЯЩЕЙ Windows — до выпуска, а не после.
  #
  # 08.09 за вечер к человеку уехало семь версий подряд, и каждую ломало
  # ровно то, чего линукс не видит: занятый адрес адаптера, скачивание правил
  # в момент перестройки DNS, две живые копии разных версий. Проверял их
  # человек на своей рабочей машине, потому что больше было некому: боевые
  # проверки гонялись на линуксе, где весь windows-путь подменён заглушками.
  #
  # Теперь выпуск ждёт зелёной Windows. Красное к семье не уезжает.
  windows:
    name: Тесты на настоящей Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Тесты
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Сборка .exe
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -ldflags "-H=windowsgui -s -w" -o Kelevra.exe ./cmd/kelevra
          Get-Item Kelevra.exe | Select-Object Name, Length

  vypusk:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Гейт: красное к человеку не уезжает. Те же проверки, что и в kelevra.yml,
      # но здесь они блокируют именно выпуск, а не merge.
      - name: Тесты
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: Версия из тега
        id: versiya
        run: |
          TEG="${GITHUB_REF_NAME}"
          VERSIYA="${TEG#app-v}"
          if [ -z "$VERSIYA" ] || [ "$VERSIYA" = "$TEG" ]; then
            echo "✗ тег $TEG не похож на app-vX.Y.Z"; exit 1
          fi
          echo "teg=$TEG" >> "$GITHUB_OUTPUT"
          echo "versiya=$VERSIYA" >> "$GITHUB_OUTPUT"
          # Версия с суффиксом (0.6.50-sluzhba) — выпуск предварительный.
          # Обновление у людей такие пропускает намеренно (internal/obnovlenie:
          # r.Prerelease), поэтому непроверенное живьём не уезжает всей семье
          # само, а тот, кто взялся проверять, берёт его со страницы релизов,
          # а не из вложений к сборке.
          #
          # Кольцо: строка «kolco: proba» в аннотации тега делает предварительным
          # и выпуск без суффикса. Такую сборку получают только устройства, кому
          # её назначил пульт (ссылка на файл этого релиза); GitHub Latest
          # остаётся прежним. Всем — потом той же сборкой, без пересборки:
          # gh release edit <тег> --prerelease=false --latest.
          git fetch --force origin "refs/tags/$TEG:refs/tags/$TEG"
          KOLCO=false
          if git tag -l --format='%(contents)' "$TEG" | grep -qx 'kolco: proba'; then
            KOLCO=true
          fi
          case "$VERSIYA" in
            *-*) echo "predvaritelnyy=true" >> "$GITHUB_OUTPUT"; echo "выпуск предварительный" ;;
            *)   if [ "$KOLCO" = true ]; then
                   echo "predvaritelnyy=true" >> "$GITHUB_OUTPUT"; echo "выпуск предварительный: кольцо (пульт), не Latest"
                 else
                   echo "predvaritelnyy=false" >> "$GITHUB_OUTPUT"
                 fi ;;
          esac
          echo "выпускаю $VERSIYA по тегу $TEG"

      - name: Сборка под Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          VERSIYA: ${{ steps.versiya.outputs.versiya }}
        run: |
          mkdir -p build
          go build \
            -ldflags "-H=windowsgui -s -w -X github.com/HRYNdev/kelevra-desktop/internal/podpiska.Versiya=$VERSIYA" \
            -o build/Kelevra.exe ./cmd/kelevra
          ls -l build/Kelevra.exe

      # Версия обязана быть ВНУТРИ файла: пустой -X молча оставляет
      # «0.1.0-rabota», и тогда обновление у человека не сработает — он
      # останется на старой версии навсегда, сколько бы релизов ни вышло.
      - name: Версия внутри exe
        env:
          VERSIYA: ${{ steps.versiya.outputs.versiya }}
        run: |
          if ! grep -qa "$VERSIYA" build/Kelevra.exe; then
            echo "✗ в собранном exe нет строки $VERSIYA: ldflags не сработали"; exit 1
          fi
          echo "   $(stat -c%s build/Kelevra.exe) байт, версия $VERSIYA внутри найдена"
          sha256sum build/Kelevra.exe | tee build/Kelevra.exe.sha256

      # Подпись выпуска (internal/podpis). Клиенты версии с проверкой подписи
      # ставят обновление, только если рядом лежит Kelevra.exe.sig, сделанный
      # нашим ключом: без неё релиз не обновит никого. Закрытый ключ — секрет
      # репозитория KELEVRA_SIGN_KEY (seed ed25519 в base64); команда сама
      # сверяет результат со вшитым открытым ключом, так что секрет не от той
      # пары роняет выпуск здесь, а не у людей. Секрета нет — выпуск падает.
      - name: Подписать Kelevra.exe
        env:
          KELEVRA_SIGN_KEY: ${{ secrets.KELEVRA_SIGN_KEY }}
        run: |
          go run ./cmd/podpisat build/Kelevra.exe Kelevra.exe
          test -s build/Kelevra.exe.sig

      # Описание берём из аннотации тега: она пишется человеком в момент
      # выпуска и живёт в git, а не только на странице релиза.
      - name: Описание из аннотации тега
        env:
          TEG: ${{ steps.versiya.outputs.teg }}
        run: |
          # actions/checkout кладёт ЛЁГКИЙ тег (ссылка прямо на коммит), и
          # %(contents) тогда отдаёт сообщение коммита, а не аннотацию.
          # Перетягиваем настоящий тег с сервера, перезаписав локальный.
          git fetch --force origin "refs/tags/$TEG:refs/tags/$TEG"
          git tag -l --format='%(contents)' "$TEG" | grep -vx 'kolco: proba' > build/opisanie.md || true
          if [ ! -s build/opisanie.md ]; then
            echo "Сборка $TEG." > build/opisanie.md
          fi
          cat build/opisanie.md

      # ЧЕРНОВИК, а не сразу публикация. Обновление у человека берёт ПОСЛЕДНИЙ
      # релиз и качает из него Kelevra.exe. Опубликованный релиз без файла — это
      # не «полвыпуска», а поломка прямо у него: 28.08 выгрузка отдала пустой
      # ответ, и на GitHub полминуты висела версия вообще без .exe.
      - name: Черновик релиза с файлом
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versiya.outputs.teg }}
          name: Kelevra ${{ steps.versiya.outputs.versiya }}
          body_path: build/opisanie.md
          files: |
            build/Kelevra.exe
            build/Kelevra.exe.sig
          draft: true
          prerelease: ${{ steps.versiya.outputs.predvaritelnyy == 'true' }}

      # Публикуем только после того, как файл лёг и виден снаружи, и только
      # если скачанное посторонним совпало со сборкой по sha256.
      - name: Проверить файл и опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
          TEG: ${{ steps.versiya.outputs.teg }}
        run: |
          set -eu
          RAZMER=$(gh release view "$TEG" --json assets \
            --jq '.assets[] | select(.name=="Kelevra.exe") | .size')
          if [ -z "${RAZMER:-}" ] || [ "$RAZMER" -lt 1000000 ]; then
            echo "✗ Kelevra.exe в черновике нет или он огрызок ($RAZMER) — релиз остаётся ЧЕРНОВИКОМ"
            exit 1
          fi
          echo "   в черновике Kelevra.exe: $RAZMER байт"
          RAZMER_SIG=$(gh release view "$TEG" --json assets             --jq '.assets[] | select(.name=="Kelevra.exe.sig") | .size')
          if [ -z "${RAZMER_SIG:-}" ] || [ "$RAZMER_SIG" -lt 60 ]; then
            echo "✗ Kelevra.exe.sig в черновике нет ($RAZMER_SIG) — релиз остаётся ЧЕРНОВИКОМ"
            exit 1
          fi
          # Предварительный выпуск не может быть «последним»: GitHub отвечает
          # на такое отказом 422 и релиз остаётся черновиком, то есть человек
          # его не видит вовсе. Последним помечаем только боевые версии.
          if [ "${{ steps.versiya.outputs.predvaritelnyy }}" = "true" ]; then
            gh release edit "$TEG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TEG" --draft=false --latest
          fi
          echo "── скачиваю как посторонний"
          for popytka in 1 2 3 4 5; do
            rm -f /tmp/skachano.exe
            if curl -sSLf -o /tmp/skachano.exe \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TEG/Kelevra.exe"; then
              break
            fi
            echo "   попытка $popytka не удалась, жду"; sleep 5
          done
          SHA_MOY=$(cut -d' ' -f1 build/Kelevra.exe.sha256)
          SHA_TAM=$(sha256sum /tmp/skachano.exe | cut -d' ' -f1)
          if [ "$SHA_MOY" != "$SHA_TAM" ]; then
            echo "✗ скачанное снаружи не совпало со сборкой ($SHA_MOY против $SHA_TAM)"; exit 1
          fi
          echo "✓ sha256 совпал: $SHA_MOY"
          curl -sSLf -o /tmp/skachano.sig             "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TEG/Kelevra.exe.sig"
          if ! cmp -s /tmp/skachano.sig build/Kelevra.exe.sig; then
            echo "✗ подпись снаружи не совпала с сделанной в сборке"; exit 1
          fi
          echo "✓ подпись снаружи на месте"
          echo "✓ https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TEG"
