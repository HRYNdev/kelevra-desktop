name: kelevra-desktop

# Сборка и проверка нашего десктопного клиента: чистый Go, кросс-компиляция
# под Windows, без wails/pnpm — тот стек ушёл 19.08 при переписывании с нуля (#1).
# Реальный релиз собирает и публикует vypusk.sh локально; этот воркфлоу — гейт PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Тесты
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Сборка под Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        # Номер 99.0.0 не украшение. Внутри сборки живёт проверка обновлений, и
        # без номера версия остаётся 0.1.0-rabota — младше любого выпущенного
        # релиза. Проверочная сборка тут же объявляла найденное «новой версией»
        # и предлагала человеку откатиться на релиз, затирая ровно то, что он
        # взялся проверять. Номер заведомо старше всех выпущенных снимает это
        # целиком, а слово «proverka» не даёт спутать её с боевой.
        run: |
          go build -ldflags "-X github.com/HRYNdev/kelevra-desktop/internal/podpiska.Versiya=99.0.0-proverka-${{ github.ref_name }}" -o build/Kelevra.exe ./cmd/kelevra
      # Готовый файл из ветки: нужен, чтобы проверить сборку на живой машине,
      # не выпуская её всем. Тег сразу уезжает семье автообновлением, а тут
      # человек скачивает и ставит руками только себе.
      - name: Забрать Kelevra.exe
        uses: actions/upload-artifact@v4
        with:
          name: Kelevra-${{ github.ref_name }}
          path: build/Kelevra.exe
          retention-days: 14
