name: kelevra-desktop

# Сборка и проверка нашего десктопного клиента: чистый Go, кросс-компиляция
# под Windows, без wails/pnpm — тот стек ушёл 19.08 при переписывании с нуля (#1).
# Реальный релиз собирает и публикует vypusk.sh локально; этот воркфлоу — гейт PR.
on:
  pull_request:
  push:
    branches: [main]
  # Проверочная сборка с ЗАДАННЫМ номером версии.
  #
  # Нужна, чтобы проверять обновление на стенде, не выпуская ничего семье:
  # тег app-vX.Y.Z уезжает всем автообновлением, а здесь файл просто лежит
  # артефактом. Без номера сборка носит внутри «0.1.0-rabota» и считает себя
  # старше любого релиза — обновление на такой проверить нельзя.
  workflow_dispatch:
    inputs:
      versiya:
        description: "Номер версии внутри exe (например 0.6.63-stend). Пусто — как обычно"
        required: false
        default: ""

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Тесты
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Сборка под Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          VERSIYA: ${{ github.event.inputs.versiya }}
        run: |
          if [ -n "$VERSIYA" ]; then
            go build -ldflags "-H=windowsgui -s -w -X github.com/HRYNdev/kelevra-desktop/internal/podpiska.Versiya=$VERSIYA" -o build/Kelevra.exe ./cmd/kelevra
            # Пустой -X молча оставляет заводскую строку, и стенд будет
            # проверять не то, что думает: сверяем глазами (та же проверка,
            # что в vypusk.yml).
            if ! grep -q "$VERSIYA" build/Kelevra.exe; then
              echo "✗ в собранном exe нет строки $VERSIYA: ldflags не сработали"; exit 1
            fi
            echo "✓ проверочная сборка с версией $VERSIYA"
          else
            go build -o build/Kelevra.exe ./cmd/kelevra
          fi
      # Готовый файл из ветки: нужен, чтобы проверить сборку на живой машине,
      # не выпуская её всем. Тег сразу уезжает семье автообновлением, а тут
      # человек скачивает и ставит руками только себе.
      # Имя артефакта: у PR github.ref_name — это «110/merge», а слэш в имени
      # артефакта запрещён, и шаг падает КРАСНЫМ на зелёных тестах. Так и
      # вышло 09.09.2026 на PR #110: тесты, vet и сборка прошли, а проверка
      # значилась проваленной из-за имени файла. Красный по такому поводу
      # хуже бесполезного: он приучает не верить гейту.
      - name: Забрать Kelevra.exe
        uses: actions/upload-artifact@v4
        with:
          name: Kelevra-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}
          path: build/Kelevra.exe
          retention-days: 14

  # Тесты на НАСТОЯЩЕЙ Windows. До 08.09 их не было в бою вовсе: заготовка
  # лежала в stend/ci/kelevra.yml и никогда не применялась, а боевая проверка
  # гонялась на линуксе — там весь windows-путь подменён заглушками
  # (trey_other.go, proksi_other.go, vinsluzhba_other.go).
  #
  # Чего это стоило. 08.09 за вечер вышло семь версий подряд, и каждую ломало
  # на Windows то, чего линукс не видит: занятый адрес сетевого адаптера,
  # скачивание правил в момент перестройки DNS, две живые копии разных версий.
  # Проверял всё это человек на своей рабочей машине, версия за версией.
  windows:
    name: Тесты на настоящей Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Тесты
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Сборка .exe
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -ldflags "-H=windowsgui -s -w" -o Kelevra.exe ./cmd/kelevra
          Get-Item Kelevra.exe | Select-Object Name, Length
