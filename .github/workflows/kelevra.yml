name: kelevra-desktop

# Сборка и проверка нашего десктопного клиента: чистый Go, кросс-компиляция
# под Windows, без wails/pnpm — тот стек ушёл 19.08 при переписывании с нуля (#1).
# Реальный релиз собирает и публикует vypusk.sh локально; этот воркфлоу — гейт PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Тесты
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: Сборка под Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -o build/Kelevra.exe ./cmd/kelevra
