<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Kelevra</title>
<style>
  :root {
    --fon:#0b0d11; --karta:#14171d; --karta-verh:#191d24; --gran:#242a34;
    --tekst:#e9edf3; --tihiy:#8b94a4; --slabyy:#5f6877;
    --akcent:#3ddc84; --akcent-tem:#0b1a11;
    --zhdem:#f0b429; --beda:#ff6b6b;
    --shapka:56px; --nizhnyaya:98px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--fon); color:var(--tekst);
    font:15px/1.45 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    user-select:none;
  }

  /* Шапка приклеена сверху, кнопка действия — снизу, а всё, что между ними,
     прокручивается. Раньше страница просто росла вниз, и на окне 420x660
     «Сменить код доступа» и журнал уезжали за нижний край. */
  .shapka {
    position:fixed; top:0; left:0; right:0; height:var(--shapka); z-index:3;
    display:flex; align-items:center; gap:10px; padding:0 18px;
    background:rgba(11,13,17,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--gran);
  }
  .shapka .imya { font-size:16px; font-weight:650; letter-spacing:.3px; }
  .znachok { display:block; }
  .chip {
    margin-left:auto; display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--tihiy); padding:5px 10px 5px 8px;
    border:1px solid var(--gran); border-radius:999px; background:var(--karta);
  }
  .tochka { width:7px; height:7px; border-radius:50%; background:var(--slabyy); }
  .chip.rabotaet .tochka { background:var(--akcent); box-shadow:0 0 8px var(--akcent); }
  .chip.rabotaet { color:var(--akcent); border-color:rgba(61,220,132,.35); }
  .chip.podnimaem .tochka { background:var(--zhdem); animation:pulse 1.1s infinite; }
  .chip.podnimaem { color:var(--zhdem); }
  .chip.slomalos .tochka { background:var(--beda); }
  .chip.slomalos { color:var(--beda); }
  @keyframes pulse { 50% { opacity:.25; } }

  .lenta {
    position:absolute; top:var(--shapka); bottom:0; left:0; right:0;
    overflow-y:auto; overflow-x:hidden; padding:0 18px var(--nizhnyaya);
  }
  /* Экран кода — единственный без нижней панели, и высота .lenta тут задана
     жёстко (absolute top/bottom). Центрируем ПО-НАСТОЯЩЕМУ: раньше комментарий
     ниже обещал «центрируем по окну», а делал margin-top:68px — карточка
     висела в верхней трети, под ней зияло ~270px пустоты (снимок 1_kod).
     Карточка кода ~270px при окне 604px — переполнения, при котором flex
     обрезал бы верх, тут быть не может. */
  .lenta.bez-nizhney {
    padding-bottom:18px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .lenta::-webkit-scrollbar { width:8px; }
  .lenta::-webkit-scrollbar-thumb { background:#242a34; border-radius:4px; }
  .lenta::-webkit-scrollbar-thumb:hover { background:#313a48; }

  /* Верхний отступ переехал сюда с .lenta: круг состояния ниже — sticky,
     и её "top:0" считается от padding-края СКРОЛЛЯЩЕГОСЯ .lenta. Если отступ
     оставить на .lenta, при долгой прокрутке остаётся спорная полоса над
     кругом (браузерная семантика top-padding скролл-контейнера). Обычный
     padding на нескроллящемся предке такой неоднозначности не даёт — он
     просто часть потока и уезжает вместе с содержимым. */
  #karta-svyazi { padding-top:16px; }

  .karta { background:var(--karta); border:1px solid var(--gran); border-radius:16px; padding:16px; }
  .karta + .karta, .karta + .polosa, .polosa + .karta { margin-top:12px; }

  /* Две вкладки: «Сеть» и «Настройки» (спека 04.08) — больше вкладок нет.
     sticky — переключатель не должен уезжать при прокрутке длинного списка
     узлов или журнала, иначе на вторую вкладку не вернуться не прокрутив назад. */
  .vkladki {
    display:flex; gap:4px; position:sticky; top:0; z-index:2; padding-bottom:10px;
    background:var(--fon);
  }
  .vkladka {
    flex:1; padding:9px; text-align:center; font-size:13.5px; font-weight:600;
    color:var(--tihiy); background:var(--karta); border:1px solid var(--gran); border-radius:11px;
  }
  .vkladka.aktivna { color:var(--tekst); border-color:#313a48; background:#191d24; }

  /* Круг состояния — вариант C из спеки 04.08: тонкое кольцо со свечением,
     спокойное и не вырвиглазное («какой нить переливающийся не вырвиглазный
     круг»). Заменяет прежнюю прямоугольную карточку с щитом. */
  .krug-blok { display:flex; flex-direction:column; align-items:center; padding:6px 0 4px; }
  .krug-obertka { position:relative; width:144px; height:144px; }
  .krug-obertka svg { width:100%; height:100%; overflow:visible; }
  .krug-fon { fill:none; stroke:var(--gran); }
  .krug-koltso {
    fill:none; stroke:var(--slabyy); stroke-linecap:round; transition:stroke .3s;
    transform-box:fill-box; transform-origin:center;
  }
  .krug-serdtse {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:0 18px;
  }
  .krug-slovo { font-size:17px; font-weight:650; letter-spacing:.2px; }
  /* Слово длиннее девяти букв («подключаюсь») при 17px вылезает за окружность
     буквами по обе стороны. Резать смысл ради вёрстки не хочу, поэтому длинному
     слову даём кегль поменьше — «защищено» и «отключено» остаются крупными. */
  .krug-slovo.dlinnoe { font-size:14.5px; }
  /* Режим + узел (или, когда служба начнёт его отдавать, транспорт + мс)
     редко влезает в одну строку на круге такой ширины — переносим на две,
     а не режем полезное слово многоточием после первых 15 символов. */
  .krug-pod {
    font-size:11.5px; line-height:1.3; color:var(--tihiy); margin-top:5px; max-width:112px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; text-overflow:ellipsis;
  }

  /* Медленное, мягкое дыхание свечения — не мигание. Хватает 3-4 секунд на
     цикл, чтобы глаз не цеплялся («не вырвиглазный»). */
  @keyframes krug-dyshit {
    0%, 100% { filter:drop-shadow(0 0 3px currentColor); opacity:.75; }
    50% { filter:drop-shadow(0 0 13px currentColor); opacity:1; }
  }
  @keyframes krug-vrashaetsya { to { transform:rotate(360deg); } }

  .krug-blok.rabotaet .krug-koltso { stroke:var(--akcent); color:var(--akcent);
    animation:krug-dyshit 3.6s ease-in-out infinite; }
  .krug-blok.rabotaet .krug-slovo { color:var(--akcent); }
  .krug-blok.podnimaem .krug-koltso { stroke:var(--zhdem); color:var(--zhdem);
    stroke-dasharray:34 220; animation:krug-vrashaetsya 2.6s linear infinite; }
  .krug-blok.podnimaem .krug-slovo { color:var(--zhdem); }
  .krug-blok.slomalos .krug-koltso { stroke:var(--beda); color:var(--beda);
    animation:krug-dyshit 2.8s ease-in-out infinite; }
  .krug-blok.slomalos .krug-slovo { color:var(--beda); }
  .krug-blok.stoit .krug-koltso { stroke:var(--slabyy); }

  /* margin 13px, не 2px: слева от текста должен быть тот же отступ, что и у
     карточек/узлов ниже (их padding 13-16px от края .lenta) — раньше «ВЫБОР
     УЗЛА» торчал на 11px левее собственного списка, рваный левый край.
     Цвет — tihiy, не slabyy: у slabyy контраст 3.46:1 на фоне (WCAG требует
     4.5:1 для текста 11.5px), обмерено формулой относительной яркости. */
  .zagolovok-bloka {
    display:flex; align-items:center; margin:18px 13px 8px;
    font-size:11.5px; letter-spacing:.9px; text-transform:uppercase; color:var(--tihiy);
  }
  /* Тот же капкан, что у .perekl-ryad: явный display:flex перебивает
     встроенное [hidden]{display:none}, и скрытый заголовок остался бы виден. */
  .zagolovok-bloka[hidden] { display:none; }
  .zagolovok-bloka .sprava { margin-left:auto; text-transform:none; letter-spacing:0; font-size:12px; }

  /* Переключатель автозапуска: строка-карточка вместо чекбокса, чтобы попасть
     в общий тёмный стиль настроек. */
  .perekl-ryad {
    display:flex; align-items:center; gap:10px; margin-top:8px;
    padding:11px 13px; border:1px solid var(--gran); border-radius:12px; background:var(--karta);
  }
  /* Явный display:flex у .perekl-ryad перебивает встроенное [hidden]{display:none} —
     без этого правила скрытый (не-Windows) тумблер всё равно рисовался бы. */
  .perekl-ryad[hidden] { display:none; }
  .perekl-ryad .perekl-tekst { font-size:13.5px; flex:1; min-width:0; }
  /* Подпись под тумблером вместо отдельного блока-предупреждения ниже:
     тот же смысл («ведёт на старую копию — почините нажатием»), но без
     своих padding/border/margin — на счету каждый пиксель высоты окна. */
  .perekl-tekst .podpis-ustarela {
    display:block; margin-top:2px; font-size:11.5px; line-height:1.35; color:var(--zhdem);
  }
  .perekl {
    flex:none; width:40px; height:24px; padding:0; border-radius:999px;
    background:#242a34; position:relative; transition:background .15s;
  }
  .perekl .knob {
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--tihiy); transition:left .15s, background .15s;
  }
  .perekl.vklyuchen { background:rgba(61,220,132,.32); }
  .perekl.vklyuchen .knob { left:18px; background:var(--akcent); }
  .perekl.ustarela { background:rgba(240,180,41,.32); }
  .perekl.ustarela .knob { background:var(--zhdem); }
  .perekl:disabled { opacity:.55; cursor:default; }

  .uzel {
    display:flex; align-items:center; gap:11px; width:100%; padding:11px 13px;
    margin-top:8px; border-radius:12px; border:1px solid var(--gran); background:var(--karta);
    color:var(--tekst); font:inherit; font-size:14px; cursor:pointer; text-align:left;
    transition:border-color .15s, background .15s;
  }
  .uzel:hover:not(:disabled) { background:#191d24; border-color:#313a48; }
  .uzel.vybran { border-color:rgba(61,220,132,.45); background:rgba(61,220,132,.06); }
  .uzel.vybran .imya { color:var(--akcent); font-weight:600; }
  .uzel .signal { width:8px; height:8px; border-radius:50%; flex:none; background:var(--slabyy); }
  .uzel .signal.bystro { background:var(--akcent); }
  .uzel .signal.sredne { background:var(--zhdem); }
  .uzel .signal.medlenno { background:#ef8354; }
  .uzel .signal.mertv { background:var(--beda); }
  .uzel .imya { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .uzel .ms { margin-left:auto; color:var(--tihiy); font-size:12px; font-variant-numeric:tabular-nums; }
  /* Узел с бедой (сигнал mertv, красная точка) раньше писал текст беды тем же
     серым, что и обычные мс — глазом не отличить «64 мс» от «нет ответа» без
     точки. Текст теперь того же цвета, что и точка рядом. */
  .uzel .ms.mertv { color:var(--beda); }
  .uzel:disabled { cursor:default; opacity:.75; }

  button {
    font:inherit; cursor:pointer; border:0; border-radius:12px;
    -webkit-tap-highlight-color:transparent;
  }
  button:focus-visible, input:focus-visible { outline:2px solid var(--akcent); outline-offset:2px; }
  .glavnaya {
    width:100%; padding:14px; font-size:15.5px; font-weight:650;
    background:var(--akcent); color:var(--akcent-tem); transition:.15s;
  }
  .glavnaya:hover:not(:disabled) { filter:brightness(1.07); }
  .glavnaya:active:not(:disabled) { transform:translateY(1px); }
  /* Разрыв связи — не праздник: гасим кнопку, чтобы самой яркой в окне была
     та, что защищает, а не та, что выключает. */
  .glavnaya.opasnaya { background:#1e242e; color:var(--tekst); border:1px solid var(--gran); }
  .glavnaya.opasnaya:hover:not(:disabled) { border-color:rgba(255,107,107,.5); color:var(--beda); filter:none; }
  .glavnaya:disabled { opacity:.55; cursor:default; }
  .tihaya {
    width:100%; padding:11px; font-size:13.5px; font-weight:500;
    background:transparent; color:var(--tihiy); border:1px solid var(--gran);
  }
  /* Полная защита — единственное на экране предложение стать защищённее, и
     карточка над ней прямо показывает пальцем: «нажмите ниже "Включить полную
     защиту"». Обычная .tihaya красит её СЛАБЕЕ вкладок «Сеть»/«Настройки»:
     зовущий текст и выключенный вид спорят друг с другом, глаз читает кнопку
     как недоступную. Даём акцент — заметнее вкладок, но тише круга и главной
     кнопки внизу, чтобы порядок важности остался прежним. */
  .tihaya.zovyot {
    color:var(--akcent); font-weight:600;
    background:rgba(61,220,132,.07); border-color:rgba(61,220,132,.42);
  }
  .tihaya.zovyot:hover:not(:disabled) {
    background:rgba(61,220,132,.13); border-color:var(--akcent);
  }
  /* В настройках .tihaya — пункты списка, а не призыв к действию: ставим их
     по левому краю, чтобы он совпал со строкой тумблера, заголовками блоков и
     узлами на соседней вкладке. Раньше надписи стояли по центру, и левый край
     экрана был рваным. Кнопка полной защиты на вкладке «Сеть» — призыв, она
     остаётся центрованной. */
  #tab-nastroyki .tihaya {
    text-align:left; padding-left:14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  /* Рамка + текст слева читались как ПОЛЕ ВВОДА. Шеврон возвращает пункту
     смысл действия — тот же приём, что в списках настроек телефона. */
  #tab-nastroyki .tihaya::after { content:"\203A"; color:var(--slabyy); font-size:18px; line-height:1; }
  /* Опять display:flex поверх [hidden] — «Скопировать журнал» скрыт по умолчанию. */
  #tab-nastroyki .tihaya[hidden] { display:none; }
  .tihaya:hover { color:var(--tekst); border-color:#313a48; }
  .ssylka {
    background:none; border:0; padding:0; color:var(--tihiy); font-size:12px;
    text-decoration:underline; text-underline-offset:3px;
  }
  .ssylka:hover { color:var(--tekst); }
  .ssylka:disabled { color:var(--slabyy); cursor:default; text-decoration:none; }

  .niz {
    position:fixed; left:0; right:0; bottom:0; z-index:3; padding:12px 18px 14px;
    background:linear-gradient(to top, var(--fon) 62%, rgba(11,13,17,0));
  }

  input {
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--gran);
    background:#0d1014; color:var(--tekst); font:inherit; font-size:16px; letter-spacing:2px;
    user-select:text;
  }
  input::placeholder { letter-spacing:.5px; color:var(--slabyy); }

  .beda {
    display:none; margin-top:12px; padding:11px 13px; border-radius:12px;
    background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.28);
    color:#ffb1b1; font-size:12.5px; line-height:1.45;
    white-space:pre-wrap; word-break:break-word; user-select:text;
  }
  .beda.vidno { display:block; }
  .beda.spokoyno { background:rgba(139,148,164,.08); border-color:var(--gran); color:var(--tihiy); }
  .beda.vnimanie { background:rgba(240,180,41,.09); border-color:rgba(240,180,41,.3); color:#f3cf86; }
  .beda-zagolovok { font-weight:600; font-size:13.5px; margin-bottom:5px; }
  .beda-sovet { color:#e8b9b9; }
  .beda-podrobnosti {
    display:block; margin-top:9px; padding:0; border:0; background:none;
    color:var(--tihiy); font:inherit; font-size:11.5px; text-decoration:underline;
    text-underline-offset:2px; cursor:pointer;
  }
  .beda-syroe {
    margin-top:8px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:11px; line-height:1.45; color:var(--tihiy); word-break:break-word;
  }
  /* Минимальные данные о подписке — спокойной строкой под кругом (спека
     04.08: «должны быть минимальные данные о подписке»). Это не кнопка и не
     карточка — подпись, поэтому без рамки и фона. Рамку и фон возвращаем
     только когда срок на исходе: там строка обязана ловить глаз. */
  .podpiska {
    display:flex; align-items:center; gap:8px; margin:2px 0 10px; padding:2px 13px;
    border:1px solid transparent; border-radius:12px;
    font-size:12.5px; color:var(--tihiy);
  }
  .podpiska .srok { margin-left:auto; color:var(--tihiy); }
  .podpiska.istekaet {
    padding:11px 13px; border-color:rgba(240,180,41,.3); background:rgba(240,180,41,.07);
  }
  .podpiska.istekaet .srok { color:var(--zhdem); }

  #zhurnal {
    max-height:190px; overflow:auto; margin-top:10px; padding:10px 12px;
    background:#0d1014; border:1px solid var(--gran); border-radius:12px;
    font:11.5px/1.45 "Cascadia Mono", Consolas, monospace; color:var(--tihiy);
    white-space:pre-wrap; word-break:break-word; text-align:left; user-select:text;
  }
  #zhurnal::-webkit-scrollbar { width:8px; }
  #zhurnal::-webkit-scrollbar-thumb { background:#242a34; border-radius:4px; }

  /* Экран кода — единственный, у него нет нижней панели: центрируем по окну.
     52px + те же 16px, что раньше давал padding-top у .lenta (он переехал в
     #karta-svyazi ради sticky-карточки состояния) — экран кода этим не
     затронут, но отступ обязан остаться тем же. */
  #karta-koda { margin-top:0; }
  #karta-koda .vstuplenie { font-size:13px; color:var(--tihiy); margin:8px 0 14px; line-height:1.5; }
  #karta-koda h2 { font-size:17px; margin:0; font-weight:650; }
</style>
</head>
<body>

<div class="shapka">
  <svg class="znachok" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 2.5 4.5 5.6v6.1c0 4.6 3.1 8.4 7.5 9.8 4.4-1.4 7.5-5.2 7.5-9.8V5.6L12 2.5Z"
          stroke="#3ddc84" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="m8.6 12.1 2.4 2.4 4.4-4.6" stroke="#3ddc84" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="imya">Kelevra</span>
  <span class="chip" id="chip"><span class="tochka"></span><span id="chip-tekst">—</span></span>
</div>

<div class="lenta" id="lenta">

  <div id="karta-koda" hidden>
    <div class="karta">
      <h2>Код доступа</h2>
      <div class="vstuplenie">Введите код, который вам выдали. Он сохранится на этом
        компьютере — вводить каждый раз не нужно.</div>
      <input id="pole-koda" placeholder="код" autocomplete="off" spellcheck="false">
      <div style="height:12px"></div>
      <button class="glavnaya" id="knopka-koda">Сохранить</button>
      <div class="beda" id="beda-koda"></div>
    </div>
  </div>

  <div id="karta-svyazi" hidden>
    <div class="vkladki" id="vkladki">
      <button class="vkladka aktivna" id="vkladka-set" type="button">Сеть</button>
      <button class="vkladka" id="vkladka-nastroyki" type="button">Настройки</button>
    </div>

    <div id="tab-set">
      <div class="krug-blok" id="krug-blok">
        <div class="krug-obertka">
          <svg viewBox="0 0 144 144" aria-hidden="true">
            <circle class="krug-fon" cx="72" cy="72" r="65" stroke-width="3"/>
            <circle class="krug-koltso" id="krug-koltso" cx="72" cy="72" r="65" stroke-width="3.5"/>
          </svg>
          <div class="krug-serdtse">
            <div class="krug-slovo" id="zvanie">отключено</div>
            <!-- Транспорт (xhttp · 63 мс) — прямое требование спеки 04.08. Служба
                 его пока не отдаёт (internal/sluzhba/sluzhba.go), поэтому строка
                 показывает то, что ЕСТЬ: режим + текущий узел. Поле готово принять
                 транспорт, как только он появится в otvetSostoyaniya. -->
            <div class="krug-pod" id="podzagolovok">трафик идёт напрямую</div>
          </div>
        </div>
      </div>

      <!-- Минимальные данные о подписке — на главном экране, под кругом
           (спека 04.08). Срок «на исходе» получает рамку и остаётся заметным
           прямо тут же, а не только где-то в настройках. -->
      <div class="podpiska" id="podpiska" hidden>
        <span id="podpiska-imya"></span><span class="srok" id="podpiska-srok"></span>
      </div>

      <div class="beda" id="beda-svyazi"></div>
      <div class="beda" id="zametka"></div>

      <button class="tihaya zovyot" id="knopka-polnaya" hidden>Включить полную защиту</button>

      <div id="uzly"></div>
    </div>

    <div id="tab-nastroyki" hidden>
      <div class="zagolovok-bloka" id="zag-avtozapusk" hidden>Приложение</div>
      <div class="perekl-ryad" id="ryad-avtozapusk" hidden>
        <span class="perekl-tekst">Запускать вместе с Windows
          <span class="podpis-ustarela" id="podpis-ustarela" hidden></span>
        </span>
        <button class="perekl" id="perekl-avtozapusk" type="button" role="switch" aria-checked="false">
          <span class="knob"></span>
        </button>
      </div>
      <div class="beda" id="beda-avtozapusk"></div>
      <div class="zagolovok-bloka">Доступ</div>
      <button class="tihaya" id="knopka-smenit">Сменить код доступа</button>

      <div class="zagolovok-bloka">Если что-то не так</div>
      <div>
        <button class="tihaya" id="knopka-zhurnal">Показать журнал</button>
        <pre id="zhurnal" hidden></pre>
        <div style="height:8px"></div>
        <button class="tihaya" id="knopka-kopirovat" hidden>Скопировать журнал</button>
      </div>
    </div>
  </div>

</div>

<div class="niz" id="niz" hidden>
  <button class="glavnaya" id="knopka-svyazi">Подключить</button>
</div>

<script>
const koren = location.pathname.replace(/index\.html$/, "");
const $ = (id) => document.getElementById(id);
let smenaKoda = false;

async function api(put, telo) {
  const o = await fetch(koren + "api/" + put, telo
      ? {method:"POST", body: JSON.stringify(telo)} : undefined);
  const d = await o.json().catch(() => ({}));
  if (!o.ok) throw new Error(d.beda || "не вышло");
  return d;
}

// Слово в круге обязано влезать в окружность (r=65 при 144px): «не подключилось»
// торчало за неё буквами по обе стороны. Держит это щуп «слово в круге» в
// stend/oblik_snimok.py — длинное слово тут покраснеет само, без моей памяти.
const podpisi = {stoit:"отключено", podnimaem:"подключаюсь", rabotaet:"защищено", slomalos:"нет связи"};

// Вторая строка внутри круга: человеку важно не слово «stoit», а что именно
// сейчас с его трафиком и через какой узел он идёт. Тип транспорта (xhttp ·
// 63 мс) тут появится, как только служба начнёт его отдавать в /api/sostoyanie
// — сейчас такого поля нет (internal/sluzhba/sluzhba.go), поэтому строка несёт
// то, что есть на самом деле, а не выдумку.
function podzagolovok(s) {
  // Имя узла тут НЕ пишем: оно и так подсвечено зелёным в списке «Выбор узла»
  // на том же экране, а в круг шириной 144px пара «режим · узел» не влезает и
  // резалась многоточием («трафик браузеров ·…»). Круг отвечает на один
  // вопрос — ЧТО защищено; какой узел — вопрос списка ниже.
  if (s.sost === "rabotaet") {
    return s.rezhim === "tunnel" ? "весь трафик" : "трафик браузеров";
  }
  if (s.sost === "podnimaem") return "пара секунд";
  // Коротко: «связь не поднялась» уже сказано крупным словом в самом круге,
  // а длинная версия резалась по ширине на четырёх сценах беды сразу.
  if (s.sost === "slomalos") return "что делать — ниже";
  return "трафик идёт напрямую";
}

// Ядро говорит на языке sing-box, а окно открывает не программист. До сих пор
// человек видел «FATAL[0000] initialize inbound/tun[0]: configure tun
// interface: permission denied» и не знал ни что случилось, ни что нажать.
// Переводим известные приметы в пару «что случилось» + «что сделать»; сырой
// текст никуда не девается — он под «подробностями», чтобы прислать его мне.
// Порядок важен: точная примета должна победить общую (таймаут — последний,
// потому что «не ответило за 45 секунд» приписано почти к любой беде старта).
const PRIMETY = [
  {kogda: /permission denied|operation not permitted|access is denied|отказано в доступе/i,
   chto: "Windows не дал создать сетевой адаптер",
   delat: "Закрой Kelevra и запусти её правой кнопкой мыши → «Запуск от имени администратора». " +
          "Не хочется каждый раз — оставайся в режиме «только браузеры», ему особых прав не нужно."},
  {kogda: /address already in use|only one usage of each socket address|bind: /i,
   chto: "Нужный порт занят другой программой",
   delat: "Обычно это второй VPN-клиент. Закрой его и нажми «Подключить» ещё раз."},
  {kogda: /\b40[13]\b|unauthorized|forbidden|authentication failed|auth failed/i,
   chto: "Код доступа не подошёл",
   delat: "Нажми «Сменить код доступа» и вставь свежий код. Если его нет — напиши мне."},
  {kogda: /no such host|dial tcp|i\/o timeout|connection refused|network is unreachable|context deadline exceeded/i,
   chto: "Не достучались до сервера",
   delat: "Проверь, открывается ли любой сайт. Если интернет есть — выбери в списке другой узел."},
  {kogda: /ядро не найдено|no such file or directory|cannot find the file/i,
   chto: "На месте нет рабочего файла",
   delat: "Нажми «Подключить» ещё раз — Kelevra скачает его сама."},
  {kogda: /сначала введите код/i,
   chto: "Код доступа ещё не введён",
   delat: "Нажми «Сменить код доступа» и вставь код из письма."},
  {kogda: /decode config|parse config|unmarshal|нет конфига|invalid config/i,
   chto: "Настройки под твоим кодом доступа не читаются",
   delat: "Нажми «Сменить код доступа» и вставь код заново. Не поможет — открой журнал и пришли его мне."},
  {kogda: /не ответило за \d+ секунд/i,
   chto: "Подключение зависло",
   delat: "Нажми «Подключить» ещё раз. Если повторится — открой журнал и пришли его мне."},
  {kogda: /не запустилось|упало при старте/i,
   chto: "Kelevra не смогла запуститься",
   delat: "Нажми «Подключить» ещё раз. Если повторится — открой журнал и пришли его мне."},
];

function perevestiBedu(syroe) {
  for (const p of PRIMETY) if (p.kogda.test(syroe)) return p;
  return {chto: "Связь не поднялась",
          delat: "Нажми «Подключить» ещё раз. Если повторяется — открой журнал и пришли его мне."};
}

// Перерисовываем только когда текст беды ДЕЙСТВИТЕЛЬНО сменился: обновление
// идёт по таймеру, а раскрытые «подробности» не должны схлопываться каждый тик.
let bedaNaEkrane = null;

function pokazatBeduSvyazi(syroe, spokoyno) {
  const klyuch = (syroe || "") + "|" + (spokoyno ? 1 : 0);
  if (klyuch === bedaNaEkrane) return;
  bedaNaEkrane = klyuch;
  const uzel = $("beda-svyazi");
  uzel.textContent = "";
  uzel.classList.toggle("vidno", !!syroe);
  uzel.classList.toggle("spokoyno", !!spokoyno);
  if (!syroe) return;
  if (spokoyno) { uzel.textContent = syroe; return; }   // это не беда, а уведомление

  const p = perevestiBedu(syroe);
  const zag = document.createElement("div");
  zag.className = "beda-zagolovok"; zag.textContent = p.chto;
  const sovet = document.createElement("div");
  sovet.className = "beda-sovet"; sovet.textContent = p.delat;
  const syr = document.createElement("div");
  syr.className = "beda-syroe"; syr.textContent = syroe; syr.hidden = true;
  const knopka = document.createElement("button");
  knopka.type = "button"; knopka.className = "beda-podrobnosti";
  knopka.textContent = "подробности";
  knopka.addEventListener("click", () => {
    syr.hidden = !syr.hidden;
    knopka.textContent = syr.hidden ? "подробности" : "скрыть подробности";
  });
  uzel.append(zag, sovet, knopka, syr);
}

function pokazatBedu(uzel, tekst, spokoyno) {
  uzel.textContent = tekst || "";
  uzel.classList.toggle("vidno", !!tekst);
  uzel.classList.toggle("spokoyno", !!spokoyno);
}

let poslednee = null;
// Две вкладки — «Сеть» и «Настройки» (спека 04.08). Липкая кнопка действия
// внизу принадлежит вкладке «Сеть» (там и круг, и список узлов); в
// «Настройках» ей делать нечего.
let vkladkaTek = "set";

function primenitVkladku() {
  const naSeti = vkladkaTek === "set";
  $("vkladka-set").classList.toggle("aktivna", naSeti);
  $("vkladka-nastroyki").classList.toggle("aktivna", !naSeti);
  $("tab-set").hidden = !naSeti;
  $("tab-nastroyki").hidden = naSeti;
  if (poslednee) $("niz").hidden = (!poslednee.kod_est || smenaKoda) || !naSeti;
}

$("vkladka-set").onclick = () => { vkladkaTek = "set"; primenitVkladku(); };
$("vkladka-nastroyki").onclick = () => { vkladkaTek = "nastroyki"; primenitVkladku(); };

async function obnovit() {
  let s;
  try { s = await api("sostoyanie"); } catch (e) { return; }
  poslednee = s;
  const nuzhenKod = !s.kod_est || smenaKoda;
  $("karta-koda").hidden = !nuzhenKod;
  $("karta-svyazi").hidden = nuzhenKod;
  $("lenta").classList.toggle("bez-nizhney", nuzhenKod);
  primenitVkladku();

  $("krug-blok").className = "krug-blok " + s.sost;
  const zvanie = podpisi[s.sost] || s.sost;
  $("zvanie").textContent = zvanie;
  $("zvanie").classList.toggle("dlinnoe", zvanie.length > 9);
  $("podzagolovok").textContent = podzagolovok(s);
  $("chip").className = "chip " + s.sost;
  $("chip-tekst").textContent = s.versiya ? "v" + s.versiya : (podpisi[s.sost] || s.sost);

  const knopka = $("knopka-svyazi");
  knopka.textContent = s.sost === "rabotaet" ? "Отключить" : "Подключить";
  knopka.classList.toggle("opasnaya", s.sost === "rabotaet");
  knopka.disabled = s.sost === "podnimaem";

  const zametka = $("zametka");
  zametka.textContent = s.zametka || "";
  // Ручной прокси означает, что без вписанного адреса трафик вообще не пойдёт
  // через Kelevra: такое нельзя показывать серой сноской под цифрами.
  zametka.className = "beda" + (s.zametka ? " vidno" : "") +
      (s.ruchnoy_proksi ? " vnimanie" : " spokoyno");

  const est = !!(s.imya || s.do_unix);
  const podpiska = $("podpiska");
  podpiska.hidden = !est;
  if (est) {
    // Без слова «ключ доступа» строка «Вова … до 15 сентября» — загадка:
    // человек видит своё имя и дату и не знает, что именно кончается.
    $("podpiska-imya").textContent = s.imya ? "Ключ доступа: " + s.imya : "Ключ доступа";
    const dney = s.do_unix ? Math.ceil((s.do_unix * 1000 - Date.now()) / 86400000) : null;
    $("podpiska-srok").textContent = s.do_unix
        ? (dney !== null && dney <= 7 ? "кончится " : "действует до ")
          + new Date(s.do_unix * 1000).toLocaleDateString("ru-RU",
            {day:"numeric", month:"long"}) : "";
    const istekaet = dney !== null && dney <= 7;
    // Строка всегда стоит на главном экране, под кругом (спека 04.08).
    // Срок «на исходе» просто получает рамку и жёлтый цвет — она и так уже
    // на самом заметном месте, никуда переезжать не надо.
    podpiska.className = "podpiska" + (istekaet ? " istekaet" : "");
  }
  $("knopka-polnaya").hidden = !s.mozhno_tun;

  // Автозапуск: на не-Windows сборке (стенд, будущий Linux-порт) тумблер
  // прячем целиком — показывать переключатель, который ничего не делает,
  // хуже, чем не показывать его вовсе.
  const ryadAvt = $("ryad-avtozapusk"), bedaAvt = $("beda-avtozapusk"), podpisAvt = $("podpis-ustarela");
  ryadAvt.hidden = !s.avtozapusk_podderzhivaetsya;
  $("zag-avtozapusk").hidden = ryadAvt.hidden;
  if (s.avtozapusk_podderzhivaetsya) {
    const perekl = $("perekl-avtozapusk");
    perekl.className = "perekl" + (s.avtozapusk_vklyuchen ? " vklyuchen" : "") +
        (s.avtozapusk_ustarela ? " ustarela" : "");
    perekl.setAttribute("aria-checked", s.avtozapusk_vklyuchen ? "true" : "false");
    // «Устарела» — короткая подпись прямо под строкой тумблера (см. .podpis-ustarela):
    // тот же смысл, что раньше нёс отдельный жёлтый блок ниже, но без своего
    // padding/border — тот блок на двух строках выталкивал журнал за нижний край.
    podpisAvt.hidden = !s.avtozapusk_ustarela || !!s.avtozapusk_beda;
    if (s.avtozapusk_ustarela && !s.avtozapusk_beda) {
      podpisAvt.textContent = "ведёт на старую копию — нажмите, чтобы починить";
    }
    if (s.avtozapusk_beda) {
      bedaAvt.textContent = "Автозапуск с Windows: " + s.avtozapusk_beda;
      bedaAvt.className = "beda vidno";
    } else {
      bedaAvt.className = "beda";
      bedaAvt.textContent = "";
    }
  }

  let beda = s.beda || "", spokoyno = false;
  if (s.kachaem_yadro) { beda = "Докачиваю рабочий файл — это разово, пара минут."; spokoyno = true; }
  else if (!s.yadro_est) { beda = "Всё нужное докачается само при первом подключении."; spokoyno = true; }
  pokazatBeduSvyazi(beda, spokoyno);
}

// Выбор узла. Список перерисовывается только когда он ДЕЙСТВИТЕЛЬНО изменился:
// иначе опрос раз в две секунды сбрасывал бы нажатие под пальцем.
let uzlySlepok = "";
let zamerIdet = false;
let tekushchiyUzel = "";  // s.imya — это владелец ключа, узел живёт только в /api/uzly

function signalKlass(u) {
  if (u.beda) return "mertv";
  if (!u.zaderzhka) return "";
  if (u.zaderzhka < 120) return "bystro";
  if (u.zaderzhka < 250) return "sredne";
  return "medlenno";
}

// Задержки берёт только живое ядро (замер — запрос ЧЕРЕЗ него). Пока ядро
// стоит, список узлов уже виден (та же конфигурация, что и в подключённом
// состоянии — Вова, снимок 21.08: список пустовал, хотя показывать было что),
// а вот цифры честно неизвестны. Прочерк вместо тишины или лживого «0 мс».
function risovatUzly(gruppy) {
  const podklyucheno = !!(poslednee && poslednee.sost === "rabotaet");
  const koren2 = $("uzly");
  koren2.innerHTML = "";
  for (const g of gruppy) {
    if (g.seychas && g.seychas !== tekushchiyUzel) {
      tekushchiyUzel = g.seychas;
      // Узел приезжает вторым запросом: без этого подпись под «защищено»
      // висела бы без имени узла до следующего опроса.
      if (poslednee) $("podzagolovok").textContent = podzagolovok(poslednee);
    }
    const zag = document.createElement("div");
    zag.className = "zagolovok-bloka";
    const levo = document.createElement("span");
    levo.textContent = g.imya;
    zag.appendChild(levo);
    if (g.sam) {
      const pravo = document.createElement("span");
      pravo.className = "sprava";
      pravo.textContent = "выбирает сам";
      zag.appendChild(pravo);
    }
    koren2.appendChild(zag);
    for (const u of g.uzly) {
      const b = document.createElement("button");
      b.className = "uzel" + (u.imya === g.seychas ? " vybran" : "");
      const signal = document.createElement("span");
      signal.className = "signal " + signalKlass(u);
      const imya = document.createElement("span");
      imya.className = "imya";
      imya.textContent = u.imya;
      const ms = document.createElement("span");
      ms.className = "ms" + (u.beda ? " mertv" : "");
      ms.textContent = u.beda ? u.beda
          : u.zaderzhka ? u.zaderzhka + " мс"
          : podklyucheno ? "" : "—";
      b.append(signal, imya, ms);
      if (g.sam) b.disabled = true;
      else b.onclick = async () => {
        try { await api("vybrat", {gruppa: g.imya, uzel: u.imya}); uzlySlepok = ""; }
        catch (e) { pokazatBedu($("beda-svyazi"), e.message); }
        obnovitUzly();
      };
      koren2.appendChild(b);
    }
    // «Проверить скорость» бьёт /api/zamerit, а тот сам стучится в узел ЧЕРЕЗ
    // ядро — без запущенного ядра он не даст ничего, кроме беды на ровном
    // месте. Пока ядро стоит, кнопки просто нет: список узлов остаётся, а
    // мерить нечем и не через что.
    if (!g.sam && g.uzly.length > 1 && podklyucheno) {
      const ryad = document.createElement("div");
      ryad.style.cssText = "margin-top:10px;text-align:right";
      const z = document.createElement("button");
      z.className = "ssylka";
      z.textContent = zamerIdet ? "Проверяю…" : "Проверить скорость";
      z.disabled = zamerIdet;
      z.onclick = async () => {
        zamerIdet = true; uzlySlepok = ""; obnovitUzly();
        try {
          const d = await api("zamerit", {uzly: g.uzly.map((u) => u.imya)});
          for (const r of d.zamer) {
            const u = g.uzly.find((x) => x.imya === r.imya);
            if (u) { u.zaderzhka = r.zaderzhka; u.beda = r.beda; }
          }
          zamerIdet = false; uzlySlepok = "zamer"; risovatUzly(gruppy);
          return;
        } catch (e) { pokazatBedu($("beda-svyazi"), e.message); }
        zamerIdet = false; uzlySlepok = ""; obnovitUzly();
      };
      ryad.appendChild(z);
      koren2.appendChild(ryad);
    }
  }
}

async function obnovitUzly() {
  let d;
  try { d = await api("uzly"); } catch (e) { return; }
  // «rabotaet или нет» — часть слепка: сами группы могут не измениться ни на
  // байт (тот же список, тот же выбор), а вот доступность замера и подпись
  // задержки («—» против чисел) зависят именно от этого поля.
  const slepok = JSON.stringify(d.gruppy) + "|" + (poslednee && poslednee.sost);
  if (slepok === uzlySlepok) return;
  uzlySlepok = slepok;
  risovatUzly(d.gruppy);
}

$("knopka-koda").onclick = async () => {
  const knopka = $("knopka-koda");
  knopka.disabled = true; pokazatBedu($("beda-koda"), "");
  try {
    await api("kod", {kod: $("pole-koda").value});
    smenaKoda = false; $("pole-koda").value = "";
  } catch (e) { pokazatBedu($("beda-koda"), e.message); }
  knopka.disabled = false; obnovit();
};

$("pole-koda").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("knopka-koda").click();
});

$("knopka-svyazi").onclick = async () => {
  const knopka = $("knopka-svyazi");
  const bylo = knopka.textContent;
  knopka.disabled = true; knopka.textContent = "…"; pokazatBedu($("beda-svyazi"), "");
  try { await api(bylo === "Отключить" ? "otklyuchit" : "podklyuchit"); }
  catch (e) { pokazatBedu($("beda-svyazi"), e.message); }
  knopka.disabled = false; obnovit();
};

// Полная защита = туннель, а он требует прав администратора: приложение
// перезапускается через окно UAC, эта копия закрывается сама.
$("knopka-polnaya").onclick = async () => {
  const knopka = $("knopka-polnaya");
  knopka.disabled = true; pokazatBedu($("beda-svyazi"), "");
  try {
    const d = await api("polnaya_zashchita", {});
    if (d.perezapusk) pokazatBedu($("beda-svyazi"), "Перезапускаюсь с правами администратора…", true);
  } catch (e) { pokazatBedu($("beda-svyazi"), e.message); }
  knopka.disabled = false;
};

// Клик всегда делает «правильную» вещь для того, что видно на экране:
// выключено → включить, включено и свежо → выключить, включено но
// устарело → включить заново (Vklyuchit перезаписывает путь).
$("perekl-avtozapusk").onclick = async () => {
  const perekl = $("perekl-avtozapusk");
  const vklyuchit = !poslednee || !poslednee.avtozapusk_vklyuchen || poslednee.avtozapusk_ustarela;
  perekl.disabled = true;
  try { await api("avtozapusk", {vklyuchit}); }
  catch (e) {
    $("beda-avtozapusk").textContent = "Автозапуск с Windows: " + e.message;
    $("beda-avtozapusk").className = "beda vidno";
  }
  perekl.disabled = false; obnovit();
};

$("knopka-smenit").onclick = () => { smenaKoda = true; obnovit(); };

// Журнал прямо в окне: иначе прислать причину можно только через проводник
// в %LOCALAPPDATA%, а человек, у которого «не работает», туда не пойдёт.
$("knopka-zhurnal").onclick = async () => {
  const pre = $("zhurnal"), knopka = $("knopka-zhurnal");
  if (!pre.hidden) {
    pre.hidden = true; $("knopka-kopirovat").hidden = true;
    knopka.textContent = "Что-то не так? Показать журнал";
    return;
  }
  try {
    const o = await fetch(koren + "api/zhurnal");
    pre.textContent = (await o.text()) || "журнал пуст";
  } catch (e) { pre.textContent = "журнал не прочитался: " + e.message; }
  pre.hidden = false; $("knopka-kopirovat").hidden = false;
  knopka.textContent = "Скрыть журнал";
  pre.scrollTop = pre.scrollHeight;
};

$("knopka-kopirovat").onclick = async () => {
  const knopka = $("knopka-kopirovat");
  try {
    await navigator.clipboard.writeText($("zhurnal").textContent);
    knopka.textContent = "Скопировано";
  } catch (e) {
    // Буфер обмена может быть закрыт: тогда выделяем текст, человек нажмёт Ctrl+C.
    const r = document.createRange(); r.selectNodeContents($("zhurnal"));
    const v = window.getSelection(); v.removeAllRanges(); v.addRange(r);
    knopka.textContent = "Выделено — нажмите Ctrl+C";
  }
  setTimeout(() => { knopka.textContent = "Скопировать журнал"; }, 2500);
};

obnovit();
obnovitUzly();
setInterval(() => { obnovit(); obnovitUzly(); }, 2000);
</script>
</body>
</html>
